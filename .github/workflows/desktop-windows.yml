name: Build Desktop App (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build backend & frontend
        run: |
          npm run build:desktop
          npm run build

      - name: Download Windows Node.js sidecar binary
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.5.0/win-x64/node.exe" -OutFile "src-tauri/binaries/node-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri App (Windows MSI/NSIS)
        uses: tauri-apps/tauri-action@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundle msi
