name: Build Desktop App (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build backend & frontend
        run: |
          npm run build:desktop
          npm run build:backend
          npm run build:frontend

      - name: Download Windows Node.js sidecar binary
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.19.0/win-x64/node.exe" -OutFile "src-tauri/binaries/node-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri App (Windows MSI + NSIS)
        env:
          ADMIN_USERNAME: "wafaweb"
          ADMIN_PASSWORD: "Wafa@1122"
          ERP_REMOTE_URL: "https://www.yasco.tech"
        run: npx tauri build --bundles msi --bundles nsis

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yasco-erp-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn